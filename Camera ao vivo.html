    <link rel="icon" type="image/png" href="https://appcor.cor-rio.work/static/core/icon.f6a224c5a4f1.png">

    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
        font-family: Arial, sans-serif;
        color: #fff;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #video-wrap {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: #000;
      }
      video {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        background: #000;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #camera-info {
        position: absolute;
        display: flex;
        flex-direction: row;
        align-items: flex-start;
        gap: 10px;
        z-index: 5;
        pointer-events: none;
        top: 0px;
        right: auto;
        left: auto;
        bottom: auto;
      }
      #logo {
        width: 88px;
        height: auto;
        object-fit: contain;
        flex-shrink: 0;
      }
      #camera-label {
        color: rgba(255, 255, 255, 0.92);
        font-size: 14px;
        font-weight: 700;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 320px;
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.7);
      }
      #loading,
      #error {
        position: absolute;
        z-index: 10;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 18px;
        text-align: center;
        font-family: Arial, sans-serif;
        background: rgba(0, 0, 0, 0.7);
        padding: 16px 24px;
        border-radius: 10px;
        max-width: 90vw;
      }
      #loading {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      #error {
        display: none;
        white-space: pre-line;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #fff;
        animation: blink 1.4s infinite both;
      }
      .dot:nth-child(2) { animation-delay: 0.2s; }
      .dot:nth-child(3) { animation-delay: 0.4s; }
      @keyframes blink {
        0%, 80%, 100% { opacity: 0; }
        40% { opacity: 1; }
      }
    </style>

    <div id="loading" bis_skin_checked="1" style="display: none;">
      <div class="dot" bis_skin_checked="1"></div>
      <div class="dot" bis_skin_checked="1"></div>
      <div class="dot" bis_skin_checked="1"></div>
    </div>
    <div id="error" bis_skin_checked="1" style="display: none;">Conexão perdida com a câmera.</div>
    <div id="video-wrap" bis_skin_checked="1" style="width: 100vw; height: 100vh; top: 0px; left: 0px; transform: none;">
      <video id="video" autoplay="" muted="" playsinline="true" webkit-playsinline="true"></video>
      <div id="camera-info" bis_skin_checked="1">
        <img id="logo" src="./Camera ao vivo_files/logo_cor_branco.9c2fdd1b6e83.png" alt="Logo Prefeitura do Rio">
        
      </div>
    </div>
    <script>
      const video = document.getElementById('video');
      const loading = document.getElementById('loading');
      const errorDiv = document.getElementById('error');
      const videoWrap = document.getElementById('video-wrap');
      const cameraInfo = document.getElementById('camera-info');
      const startUrl = "/api/camera/player/session/start/000567/";
      const heartbeatUrl = "/api/camera/player/session/heartbeat/";
      const stopUrl = "/api/camera/player/session/stop/";
      const whepBaseUrl = "/api/camera/player/whep/";
      const envIceServers = [];
      let sessionId = null;
      let pc = null;
      let heartbeatInterval = null;
      let reconnectTimer = null;
      let disconnectTimer = null;
      let firstFrameTimer = null;
      let playbackStream = new MediaStream();
      let discoveredIceServers = [];
      const RECONNECT_DELAY = 5000;
      const DISCONNECT_GRACE_DELAY = 8000;
      const FIRST_FRAME_TIMEOUT = 12000;

      video.muted = true;
      video.autoplay = true;
      video.playsInline = true;
      video.setAttribute('playsinline', 'true');
      video.setAttribute('webkit-playsinline', 'true');

      document.addEventListener('contextmenu', (event) => {
        event.preventDefault();
      }, { passive: false });

      document.addEventListener('selectstart', (event) => {
        event.preventDefault();
      }, { passive: false });

      document.addEventListener('dragstart', (event) => {
        event.preventDefault();
      }, { passive: false });

      function applyVideoOrientation() {
        const w = window.innerWidth;
        const h = window.innerHeight;
        if (h > w) {
          // Portrait: rotate wrap so video appears landscape.
          videoWrap.style.width = h + 'px';
          videoWrap.style.height = w + 'px';
          videoWrap.style.top = ((h - w) / 2) + 'px';
          videoWrap.style.left = ((w - h) / 2) + 'px';
          videoWrap.style.transform = 'rotate(90deg)';
          videoWrap.style.transformOrigin = 'center center';
        } else {
          // Landscape: normal.
          videoWrap.style.width = '100vw';
          videoWrap.style.height = '100vh';
          videoWrap.style.top = '0';
          videoWrap.style.left = '0';
          videoWrap.style.transform = 'none';
        }
      }

      function clearDisconnectTimer() {
        if (disconnectTimer) { clearTimeout(disconnectTimer); disconnectTimer = null; }
      }

      function clearFirstFrameTimer() {
        if (firstFrameTimer) { clearTimeout(firstFrameTimer); firstFrameTimer = null; }
      }

      function showError(message) {
        loading.style.display = 'none';
        errorDiv.textContent = message || 'Conexão perdida com a câmera.';
        errorDiv.style.display = 'block';
      }

      async function ensurePlayback() {
        try { await video.play(); } catch (e) { console.warn('[PLAYER] play() falhou:', e); }
      }

      // O app injeta o passe do Firebase App Check em window.__CORAppCheck; nunca vai no endereço.
      function comPasseDoApp(headers) {
        return window.__CORAppCheck ? { ...headers, 'X-Firebase-AppCheck': window.__CORAppCheck } : headers;
      }

      async function startSession() {
        const response = await fetch(startUrl, {
          method: 'POST',
          headers: comPasseDoApp({ 'Content-Type': 'application/json' }),
          body: '{}'
        });
        const rawBody = await response.text();
        let data = {};
        try { data = rawBody ? JSON.parse(rawBody) : {}; } catch (e) {}
        if (!response.ok) throw new Error(data.error || rawBody || 'Erro ao registrar sessão.');
        sessionId = data.sessionId || null;
        if (!sessionId) throw new Error('Sessão de vídeo inválida.');
        startHeartbeat();
      }

      function startHeartbeat() {
        stopHeartbeat();
        heartbeatInterval = setInterval(() => {
          if (!sessionId) return;
          fetch(heartbeatUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ sessionId }) }).catch(() => {});
        }, 20000);
      }

      function stopHeartbeat() {
        if (heartbeatInterval) { clearInterval(heartbeatInterval); heartbeatInterval = null; }
      }

      function stopSession() {
        stopHeartbeat();
        if (!sessionId) return;
        fetch(stopUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ sessionId }) }).catch(() => {});
        sessionId = null;
      }

      function cleanup() {
        clearDisconnectTimer();
        clearFirstFrameTimer();
        if (pc) {
          pc.ontrack = null;
          pc.onconnectionstatechange = null;
          pc.oniceconnectionstatechange = null;
          pc.close();
          pc = null;
        }
        playbackStream = new MediaStream();
        video.srcObject = null;
        stopSession();
      }

      function scheduleReconnect(message, delay = RECONNECT_DELAY) {
        showError(message || 'Conexão perdida. Reconectando...');
        if (reconnectTimer) return;
        reconnectTimer = setTimeout(() => {
          reconnectTimer = null;
          errorDiv.style.display = 'none';
          loading.style.display = 'flex';
          startWhep();
        }, delay);
      }

      function armDisconnectedRecovery() {
        if (disconnectTimer) return;
        disconnectTimer = setTimeout(() => {
          disconnectTimer = null;
          if (!pc) return;
          if (pc.connectionState === 'disconnected' || pc.iceConnectionState === 'disconnected') {
            cleanup();
            scheduleReconnect('Conexão perdida. Reconectando...');
          }
        }, DISCONNECT_GRACE_DELAY);
      }

      function waitForIceGathering(peerConnection) {
        return new Promise((resolve) => {
          if (peerConnection.iceGatheringState === 'complete') { resolve(); return; }
          const timeout = setTimeout(() => resolve(), 3000);
          peerConnection.addEventListener('icegatheringstatechange', () => {
            if (peerConnection.iceGatheringState === 'complete') { clearTimeout(timeout); resolve(); }
          });
        });
      }

      function handleFirstFrame() {
        if (video.videoWidth > 0 && video.videoHeight > 0) {
          clearFirstFrameTimer();
          clearDisconnectTimer();
          loading.style.display = 'none';
          errorDiv.style.display = 'none';
        }
      }

      function parseWhepIceServers(linkHeader) {
        if (!linkHeader) return [];
        const servers = [];
        for (const part of linkHeader.split(/,(?=\s*<)/)) {
          const urlMatch = part.match(/<([^>]+)>/);
          if (!urlMatch) continue;
          if (!part.match(/rel\s*=\s*"ice-server"/i)) continue;
          const server = { urls: urlMatch[1] };
          const u = part.match(/username\s*=\s*"([^"]+)"/i);
          const c = part.match(/credential\s*=\s*"([^"]+)"/i);
          if (u) server.username = u[1];
          if (c) server.credential = c[1];
          servers.push(server);
        }
        return servers;
      }

      function buildIceConfig() {
        const defaults = [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }];
        const extra = [...envIceServers, ...discoveredIceServers];
        return extra.length > 0 ? extra : defaults;
      }

      async function startWhep() {
        cleanup();
        loading.style.display = 'flex';
        errorDiv.style.display = 'none';
        try { await startSession(); } catch (e) { scheduleReconnect(e.message || 'Erro ao iniciar sessão da câmera.'); return; }

        const hadDiscoveredIceServers = discoveredIceServers.length > 0;
        const iceServers = buildIceConfig();
        console.log('[PLAYER] ICE servers:', JSON.stringify(iceServers));

        pc = new RTCPeerConnection({ bundlePolicy: 'max-bundle', iceServers });
        pc.addTransceiver('video', { direction: 'recvonly' });
        pc.addTransceiver('audio', { direction: 'recvonly' });

        pc.ontrack = async (event) => {
          if (event.track.kind === 'video') {
            playbackStream = new MediaStream([event.track]);
            video.srcObject = playbackStream;
            await ensurePlayback();
          }
          
        };
        
        video.onpause = () => { if (pc && video.srcObject) ensurePlayback(); };

        pc.onicecandidate = (e) => {
          if (e.candidate) console.log('[PLAYER] ICE candidate:', e.candidate.type, e.candidate.protocol);
        };

        video.onloadedmetadata = ensurePlayback;
        video.onloadeddata = handleFirstFrame;
        video.onresize = handleFirstFrame;
        if (typeof video.requestVideoFrameCallback === 'function') {
          const pump = () => { video.requestVideoFrameCallback(() => { handleFirstFrame(); pump(); }); };
          pump();
        }

        pc.oniceconnectionstatechange = () => {
          const s = pc ? pc.iceConnectionState : 'closed';
          console.log('[PLAYER] ICE:', s);
          if (s === 'failed') { cleanup(); scheduleReconnect('Conexão perdida. Reconectando...'); return; }
          if (s === 'disconnected') { armDisconnectedRecovery(); return; }
          if (s === 'connected' || s === 'completed') clearDisconnectTimer();
        };

        pc.onconnectionstatechange = () => {
          const s = pc ? pc.connectionState : 'closed';
          console.log('[PLAYER] conn:', s);
          if (s === 'failed' || s === 'closed') { cleanup(); scheduleReconnect('Conexão perdida. Reconectando...'); return; }
          if (s === 'disconnected') { armDisconnectedRecovery(); return; }
          if (s === 'connected') clearDisconnectTimer();
        };

        try {
          const offer = await pc.createOffer();
          await pc.setLocalDescription(offer);
          await waitForIceGathering(pc);

          const response = await fetch(whepBaseUrl, {
            method: 'POST',
            headers: comPasseDoApp({ 'Content-Type': 'application/sdp', 'X-Camera-Session': sessionId }),
            body: pc.localDescription.sdp
          });
          const answerSdp = await response.text();
          if (!response.ok) throw new Error(answerSdp || 'Erro na negociação com o servidor de vídeo.');

          const whepIceServers = parseWhepIceServers(response.headers.get('Link'));
          if (whepIceServers.length > 0) {
            discoveredIceServers = whepIceServers;
            if (!hadDiscoveredIceServers) {
              console.log('[PLAYER] Reiniciando para aplicar ICE servers do WHEP.');
              cleanup();
              scheduleReconnect('Ajustando conexão da câmera...', 250);
              return;
            }
          }

          await pc.setRemoteDescription(new RTCSessionDescription({ type: 'answer', sdp: answerSdp }));
          firstFrameTimer = setTimeout(() => {
            if (video.videoWidth === 0 || video.videoHeight === 0) {
              const iceS = pc ? pc.iceConnectionState : 'sem-pc';
              const connS = pc ? pc.connectionState : 'sem-pc';
              cleanup();
              scheduleReconnect(`Sem frames da câmera.\nICE: ${iceS} | conn: ${connS}\nReconectando...`);
            }
          }, FIRST_FRAME_TIMEOUT);
        } catch (e) {
          console.error('[PLAYER] Erro WHEP:', e);
          cleanup();
          scheduleReconnect(e.message || 'Servidor de vídeo inacessível. Reconectando...');
        }
      }

      window.addEventListener('beforeunload', () => { if (reconnectTimer) clearTimeout(reconnectTimer); cleanup(); });
      window.addEventListener('resize', applyVideoOrientation);
      applyVideoOrientation();
      startWhep();
