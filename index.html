<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STUDIO | O Corte</title>
    <style>
        :root {
            --bg: #0a0a0c;
            --surface: #121216;
            --text: #e0e0e0;
            --muted: #888890;
            --accent: #d4d4d4;
            --line: #222228;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2rem 5%;
            border-bottom: 1px solid var(--line);
        }

        .logo {
            font-weight: 700;
            font-size: 1.2rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--text);
            text-decoration: none;
        }

        nav a {
            color: var(--muted);
            text-decoration: none;
            margin-left: 2rem;
            font-size: 0.9rem;
            transition: color 0.3s ease;
        }

        nav a:hover {
            color: var(--text);
        }

        /* Main Content */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 10vh 5%;
        }

        .tagline {
            color: var(--muted);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            margin-bottom: 1.5rem;
        }

        h1 {
            font-size: clamp(3rem, 6vw, 5rem);
            font-weight: 300;
            line-height: 1.1;
            margin-bottom: 2rem;
            letter-spacing: -0.02em;
        }

        h1 span {
            font-weight: 700;
            color: var(--accent);
        }

        p.subtext {
            max-width: 600px;
            color: var(--muted);
            font-size: 1.1rem;
            margin-bottom: 3rem;
        }

        /* Buttons */
        .actions {
            display: flex;
            gap: 1rem;
        }

        .btn {
            padding: 0.8rem 2rem;
            border: 1px solid var(--line);
            background: transparent;
            color: var(--text);
            text-decoration: none;
            font-size: 0.9rem;
            letter-spacing: 0.05em;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .btn:hover {
            background: var(--surface);
            border-color: var(--muted);
        }

        .btn.primary {
            background: var(--accent);
            color: var(--bg);
            border-color: var(--accent);
        }

        .btn.primary:hover {
            background: #fff;
            border-color: #fff;
        }

        /* Footer */
        footer {
            padding: 2rem 5%;
            border-top: 1px solid var(--line);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: var(--muted);
        }

        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 1rem;
            }
            nav a {
                margin: 0 1rem;
            }
            .actions {
                flex-direction: column;
                width: 100%;
                max-width: 300px;
            }
            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo">STUDIO</a>
        <nav>
            <a href="#servicos">Serviços</a>
            <a href="#sobre">Sobre</a>
            <a href="#contato">Contato</a>
        </nav>
    </header>

    <main>
        <div class="tagline">Precisão e Corte</div>
        <h1>Feito sob medida.<br><span>Feito para durar.</span></h1>
        <p class="subtext">Desenvolvimento de sistemas, infraestrutura e soluções digitais sem enrolação. Onde a engenharia encontra a prática.</p>
        
        <div class="actions">
            <a href="#" class="btn primary">Iniciar Projeto</a>
            <a href="#" class="btn">Saber Mais</a>
        </div>
    </main>

    <footer>
        <span>&copy; 2026 STUDIO. Todos os direitos reservados.</span>
        <span>São Paulo — BR</span>
    </footer>

</body>
</html>
